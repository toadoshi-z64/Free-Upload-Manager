<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download - Free Upload Manager</title>
  <link rel="icon" type="image/png" href="../images/logo.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/globe-bg.css">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.2.0/model-viewer.min.js"></script>
  <script src="../config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    #buzz-wrap { width: 100%; overflow: hidden; background: #0d0d0d; }
    #buzz-frame { width: 100%; height: 160px; border: none; display: block; background: #0d0d0d; }
    #fd-wrap { width: 100%; overflow: hidden; background: #0d0d0d; }
    #fd-frame { width: 100%; height: 160px; border: none; display: block; background: #0d0d0d; }
  </style>
</head>
<body class="min-h-screen p-4" x-data="dlApp()" x-init="init()">
  <!-- Rotating globe background (auto-rotate, no sound/interaction) -->
  <div id="fum-globe-bg" aria-hidden="true">
    <model-viewer src="../images/globe/earth.gltf" disable-zoom interaction-prompt="none"
      shadow-intensity="0" exposure="0.5" camera-orbit="0deg 75deg 0.16m" field-of-view="30deg"
      auto-rotate auto-rotate-delay="0" rotation-per-second="6deg">
    </model-viewer>
  </div>

  <div class="text-center mb-1">
    <a href="../index.html" class="inline-flex items-center gap-3 no-underline">
      <img src="../images/logo.png" alt="Free Upload Manager" class="h-12 w-auto">
      <h1 class="text-3xl font-bold mt-1 mb-0 text-foreground">FREE UPLOAD MANAGER</h1>
    </a>
    <p class="mt-0 text-muted-foreground">Fast and reliable file hosting service.</p>
  </div>

  <div class="text-center mb-4 text-sm">
    <a href="../index.html" class="hover:underline font-medium">Index</a>
    <span class="mx-1">|</span>
    <a href="../help/index.html" class="hover:underline text-primary">Help</a>
    <span class="mx-1">|</span>
    <a href="../discord.html" target="_blank" rel="noopener noreferrer" class="hover:underline text-primary">Discord</a>
    <span class="mx-1">|</span>
    <a href="../terms.html" class="hover:underline text-primary">Terms</a>
    <span class="mx-1">|</span>
    <a href="../freemanagers.html" class="hover:underline text-primary">Free Managers</a>
    <span class="mx-1">|</span>
    <a href="../linktous.html" class="hover:underline text-primary">Link To Us</a>
    <span class="mx-1">|</span>
    <a href="../getapp.html" class="hover:underline text-primary">Get App</a>
    <span class="mx-1">|</span>
    <template x-if="accountId">
      <span>
        <a href="../account/index.html" class="hover:underline text-primary">My Account</a>
        <span class="mx-1">|</span>
        <button @click="localStorage.removeItem('fum_account_id'); accountId=''"
          class="hover:underline text-primary bg-transparent border-none p-0 cursor-pointer text-sm">Logout</button>
      </span>
    </template>
    <template x-if="!accountId">
      <a href="../auth/index.html" class="hover:underline text-primary">Login / Signup</a>
    </template>
  </div>

  <!-- Download music -->
  <audio id="download-music" src="../sound/download.mp3" loop preload="auto"></audio>

  <div class="mx-auto max-w-[60rem]">

    <!-- Error state -->
    <div x-show="error" class="mt-4 text-sm">
      <p class="text-destructive" x-text="error"></p>
      <a href="../index.html" class="text-primary hover:underline">Upload a new file →</a>
    </div>

    <!-- BuzzHeavier: embedded iframe -->
    <div x-show="!error && provider === 'buzzheavier' && fileId" x-cloak id="buzz-wrap">
      <iframe id="buzz-frame" scrolling="no"></iframe>
      <p class="text-xs text-muted-foreground mt-3">
        Uploaded using Free Upload Manager ·
        <a href="../index.html" class="hover:underline text-primary">Upload your own file</a>
      </p>
    </div>

    <!-- FileDitch: file info + embedded iframe -->
    <div x-show="!error && provider === 'fileditch'" x-cloak>
      <div class="mb-2 flex gap-3 items-baseline flex-wrap" x-show="fileName || fileSize">
        <span class="font-medium text-sm" x-text="fileName" x-show="fileName"></span>
        <span class="text-xs text-muted-foreground" x-text="fileSize" x-show="fileSize"></span>
      </div>
      <p class="text-sm text-muted-foreground mb-2" x-text="note" x-show="note"></p>
      <div id="fd-wrap">
        <iframe id="fd-frame" scrolling="no"></iframe>
      </div>
      <p class="text-xs text-muted-foreground mt-3">
        Uploaded using <a href="https://freeuploadmanager.org" class="hover:underline text-primary" target="_blank">Free Upload Manager</a> ·
        <a href="../index.html" class="hover:underline text-primary">Upload your own file</a>
      </p>
    </div>

  </div>

  <script>
    function humanSize(b) {
      if (!b) return '';
      const u = ['B','KB','MB','GB','TB'];
      const i = Math.floor(Math.log(b) / Math.log(1024));
      return parseFloat((b / Math.pow(1024, i)).toFixed(2)) + ' ' + u[i];
    }

    /* ------------------------------------------------------------------ *
     *  Ad-stripping for FileDitch HTML
     * ------------------------------------------------------------------ */
    function stripAds(html) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');

      // 1. Remove ALL <script> tags — kills ad loaders, pop-up scripts, trackers
      doc.querySelectorAll('script').forEach(el => el.remove());

      // 2. Remove ALL <iframe> tags inside the page (ad iframes)
      doc.querySelectorAll('iframe').forEach(el => el.remove());

      // 3. Remove known ad/tracker tags + adblocker detection notices
      doc.querySelectorAll(
        'ins, [id*="ad"], [id*="banner"], [id*="popup"], [id*="pop"], [id*="overlay"], ' +
        '[class*="ad-"], [class*="-ad"], [class*="ads-"], [class*="advert"], ' +
        '[class*="banner"], [class*="popup"], [class*="pop-up"], [class*="overlay"], ' +
        '[class*="modal"], [class*="interstitial"], [data-ad], [data-ad-slot], ' +
        'ins.adsbygoogle, ' +
        // Adblocker detection notice elements
        '[id*="adblock"], [class*="adblock"], ' +
        '[id*="adb-"], [class*="adb-"], ' +
        '[id*="-adb"], [class*="-adb"], ' +
        '[id*="adDetect"], [class*="adDetect"], ' +
        '[id*="adNotice"], [class*="adNotice"], ' +
        '[id*="adWall"], [class*="adWall"]'
      ).forEach(el => el.remove());

      // 3b. Text-based fallback: remove any container whose text contains
      //     adblock/whitelist keywords — catches dynamically-named divs
      const adblockKeywords = /adblocker detected|adblock detected|whitelist|please disable.*ad|disable.*adblock|ads? keep.{1,30}running/i;
      doc.querySelectorAll('div, section, aside, article').forEach(el => {
        if (adblockKeywords.test(el.textContent)) {
          // Only remove leaf-ish containers, never the entire body
          if (el !== doc.body && el !== doc.documentElement && el.querySelectorAll('a[href]').length < 5) {
            el.remove();
          }
        }
      });

      // 4. Remove <link> preloads / stylesheets pointing to external ad networks
      doc.querySelectorAll('link[href]').forEach(el => {
        const href = el.getAttribute('href') || '';
        if (/googlesyndication|doubleclick|adnxs|popads|popcash|mgid|taboola|outbrain/i.test(href)) {
          el.remove();
        }
      });

      // 5. Inject anti-popup + auto-click-download guard script
      //    Runs before anything else (no other scripts remain, but just in case)
      const guard = doc.createElement('script');
      guard.textContent = `(function(){
        // Block any new window / tab from opening
        window.open = function(url, target, features) {
          // Only allow blob: or data: downloads
          if (url && (url.startsWith('blob:') || url.startsWith('data:'))) {
            var a = document.createElement('a');
            a.href = url;
            a.download = '';
            a.click();
          }
          return null;
        };

        // Block window.location redirects to ad pages
        var _locDesc = Object.getOwnPropertyDescriptor(window, 'location');
        try {
          Object.defineProperty(window, 'location', {
            get: function(){ return _locDesc ? _locDesc.get.call(window) : location; },
            set: function(v){
              // Only allow same-origin or blob navigations
              try {
                var u = new URL(v, window.location.href);
                if (u.origin === window.location.origin || u.protocol === 'blob:') {
                  _locDesc ? (_locDesc.set && _locDesc.set.call(window, v)) : void 0;
                }
              } catch(e){}
            }
          });
        } catch(e){}

        // Report iframe height to parent
        function sh(){ parent.postMessage({type:'iframeHeight', h: document.body.scrollHeight}, '*'); }
        new ResizeObserver(sh).observe(document.body);
        sh();
      })();`;
      doc.head.insertBefore(guard, doc.head.firstChild);

      return '<!DOCTYPE html>' + doc.documentElement.outerHTML;
    }

    function dlApp() {
      return {
        accountId: localStorage.getItem('fum_account_id') || '',
        provider : '',   // 'buzzheavier' | 'fileditch'
        fileId   : '',   // BuzzHeavier only
        rawUrl   : '',   // FileDitch only
        fileName : '',
        fileSize : '',
        note     : '',
        error    : '',

        async init() {
          const p      = new URLSearchParams(window.location.search);
          const rawUrl = p.get('url') || '';
          const name   = decodeURIComponent(p.get('name') || '');
          const size   = parseInt(p.get('size') || '0', 10);
          const note   = p.get('note') || '';

          this.fileName = name;
          this.fileSize = humanSize(size);
          this.note     = note;
          this.rawUrl   = rawUrl;

          if (name) document.title = name + ' - Free Upload Manager';

          // Background music: try to autoplay; if the browser blocks it
          // (most do, until the visitor has interacted with the page),
          // start it on the first click/keypress instead.
          const dlMusic = document.getElementById('download-music');
          const tryPlay = () => dlMusic.play().catch(() => {});
          tryPlay();
          const startOnInteraction = () => {
            dlMusic.play().then(() => {
              // Only stop listening once playback actually started -
              // on a slower connection (e.g. GitHub Pages) the file may
              // not be ready yet on the very first click, so keep trying.
              document.removeEventListener('click', startOnInteraction);
              document.removeEventListener('keydown', startOnInteraction);
              document.removeEventListener('touchstart', startOnInteraction);
            }).catch(() => {});
          };
          document.addEventListener('click', startOnInteraction);
          document.addEventListener('keydown', startOnInteraction);
          document.addEventListener('touchstart', startOnInteraction);

          if (!rawUrl) { this.error = 'Ogiltig nedladdningslänk.'; return; }

          // Detect provider from the raw URL
          if (rawUrl.includes('buzzheavier.com')) {
            this.provider = 'buzzheavier';
            const decoded     = decodeURIComponent(rawUrl);
            const innerParams = new URLSearchParams(decoded.split('?')[1] || '');
            this.fileId = innerParams.get('_id')
              || decoded.replace(/.*buzzheavier\.com\//, '').split('?')[0].trim();

            if (!this.fileId) { this.error = 'Ogiltig BuzzHeavier-länk.'; return; }

            window.addEventListener('message', e => {
              if (e.data?.type === 'iframeHeight') {
                const f = document.getElementById('buzz-frame');
                if (f) f.style.height = (e.data.h + 20) + 'px';
              }
            });
            await this.loadBuzzPage();

          } else if (rawUrl.includes('fileditch')) {
            this.provider = 'fileditch';
            await this.loadFileDitchPage();

          } else {
            this.error = 'Okänd filhost i länken.';
          }
        },

        /* ---------------------------------------------------------------- *
         *  FileDitch — fetch via Worker proxy, strip ads, embed as srcdoc
         *  Sandbox: NO allow-popups, NO allow-top-navigation
         * ---------------------------------------------------------------- */
        async loadFileDitchPage() {
          const frame  = document.getElementById('fd-frame');
          if (!frame) return;

          const WORKER = (typeof FUM_CONFIG !== 'undefined') ? FUM_CONFIG.WORKER_URL : '';

          // Listen for height messages from the cleaned iframe
          window.addEventListener('message', e => {
            if (e.data?.type === 'iframeHeight') {
              frame.style.height = (e.data.h + 20) + 'px';
            }
          });

          try {
            // Reuse the same Worker proxy endpoint that already serves BuzzHeavier pages.
            // The Worker just fetches the URL server-side and returns the HTML,
            // bypassing CORS and letting us manipulate it here.
            const proxyUrl = `${WORKER}/page/fd?url=${encodeURIComponent(this.rawUrl)}`;
            const res = await fetch(proxyUrl);
            if (!res.ok) throw new Error('worker ' + res.status);

            const html = await res.text();

            // Strip all ads, popups, external scripts before embedding
            frame.srcdoc = stripAds(html);

            // Sandbox: scripts allowed (for download button), downloads allowed,
            // forms allowed — but NO popups, NO top-navigation
            frame.setAttribute('sandbox',
              'allow-scripts allow-downloads allow-forms allow-same-origin');

            frame.style.height = '120px';

          } catch (err) {
            // Fallback: direct embed without allow-popups (blocks most ad tabs)
            console.warn('Worker proxy failed, falling back to direct embed:', err);
            frame.src = this.rawUrl;
            frame.setAttribute('sandbox',
              'allow-scripts allow-downloads allow-forms allow-same-origin');
            // No allow-popups = popup ads are blocked even in fallback
          }
        },

        async loadBuzzPage() {
          const frame  = document.getElementById('buzz-frame');
          const WORKER = (typeof FUM_CONFIG !== 'undefined') ? FUM_CONFIG.WORKER_URL : '';

          try {
            const res = await fetch(`${WORKER}/page/${this.fileId}`);
            if (!res.ok) throw new Error('worker ' + res.status);

            let html = await res.text();

            const script = [
              '<script>(function(){',
              '  function sh(){parent.postMessage({type:"iframeHeight",h:document.body.scrollHeight},"*");}',
              '  new ResizeObserver(sh).observe(document.body); sh();',
              '  window.open=function(u){',
              '    if(u&&(u.includes("download")||u.startsWith("blob:"))){',
              '      var a=document.createElement("a");a.href=u;a.download="";a.click();',
              '    }',
              '    return null;',
              '  };',
              '})()<\/script>'
            ].join('\n');

            html = html.includes('</body>')
              ? html.replace('</body>', script + '</body>')
              : html + script;

            frame.srcdoc = html;
            frame.style.height = '160px';

          } catch (_) {
            frame.src = 'https://buzzheavier.com/' + this.fileId;
            frame.setAttribute('sandbox',
              'allow-scripts allow-downloads allow-forms allow-same-origin');
            frame.style.marginTop = '-135px';
            frame.style.height    = '620px';
          }
        }
      };
    }
  </script>

  <script>
    if ("serviceWorker" in navigator)
      navigator.serviceWorker.register("/service-worker.js");
  </script>
</body>
</html>
