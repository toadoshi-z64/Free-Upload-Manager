<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download — Free Upload Manager</title>
  <link rel="icon" type="image/png" href="../images/logo.png">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    #buzz-wrap {
      position: relative;
      width: 100%;
      /* Clip so the iframe's negative margin-top hides their header */
      overflow: hidden;
      border-radius: 2px;
    }
    #buzz-frame {
      width: 100%;
      height: 620px;
      border: none;
      display: block;
      /* Push their header (logo + tagline + navbar ≈ 135px) out of view */
      margin-top: -135px;
    }
  </style>
</head>
<body class="min-h-screen p-4" x-data="dlApp()" x-init="init()">

  <!-- Our header -->
  <div class="text-center mb-1">
    <a href="../index.html" class="inline-flex items-center gap-3 no-underline">
      <img src="../images/logo.png" alt="Free Upload Manager" class="h-12 w-auto">
      <h1 class="text-3xl font-bold mt-1 mb-0 text-foreground">FREE UPLOAD MANAGER</h1>
    </a>
    <p class="mt-0 text-muted-foreground">Fast and reliable file hosting service.</p>
  </div>

  <!-- Navbar -->
  <div class="text-center mb-4 text-sm">
    <a href="../index.html" class="hover:underline font-medium">Index</a>
    <span class="mx-1">|</span>
    <a href="../help/index.html" class="hover:underline text-primary">Help</a>
    <span class="mx-1">|</span>
    <template x-if="accountId">
      <span>
        <a href="../account/index.html" class="hover:underline text-primary">My Account</a>
        <span class="mx-1">|</span>
        <button @click="localStorage.removeItem('fum_account_id'); accountId=''"
          class="hover:underline text-primary bg-transparent border-none p-0 cursor-pointer text-sm">Logout</button>
      </span>
    </template>
    <template x-if="!accountId">
      <a href="../auth/index.html" class="hover:underline text-primary">Login / Signup</a>
    </template>
  </div>

  <div class="mx-auto max-w-[60rem]">

    <!-- Error: no file ID -->
    <div x-show="error" class="mt-4 text-sm">
      <p class="text-destructive" x-text="error"></p>
      <a href="../index.html" class="text-primary hover:underline">Upload a new file →</a>
    </div>

    <!-- Embedded buzzheavier page -->
    <div x-show="!error && fileId" x-cloak id="buzz-wrap">

      <iframe
        id="buzz-frame"
        :src="'https://buzzheavier.com/' + fileId"
        sandbox="allow-scripts allow-downloads allow-forms allow-same-origin allow-popups"
        scrolling="no"
        @load="onFrameLoad()"
      ></iframe>

      <p class="text-xs text-muted-foreground mt-3">
        Hosted by Free Upload Manager ·
        <a href="../index.html" class="hover:underline text-primary">Upload your own file</a>
      </p>
    </div>

  </div>

  <script>
    function dlApp() {
      return {
        accountId: localStorage.getItem('fum_account_id') || '',
        fileId   : '',
        fileName : '',
        error    : '',

        init() {
          const p      = new URLSearchParams(window.location.search);
          const rawUrl = p.get('url') || '';
          this.fileName = decodeURIComponent(p.get('name') || '');

          // Extract fileId from _id param embedded in the url value
          const decoded     = decodeURIComponent(rawUrl);
          const innerParams = new URLSearchParams(decoded.split('?')[1] || '');
          this.fileId = innerParams.get('_id')
            || decoded.replace(/.*buzzheavier\.com\//, '').split('?')[0].trim();

          if (!this.fileId) {
            this.error = 'Ogiltig nedladdningslänk.';
            return;
          }
          if (this.fileName) document.title = this.fileName + ' — Free Upload Manager';

          // Auto-resize iframe on messages from buzzheavier page
          window.addEventListener('message', e => {
            if (e.data?.type === 'iframeHeight') {
              document.getElementById('buzz-frame').style.height = (e.data.h + 20) + 'px';
            }
          });
        },

        onFrameLoad() {
          const frame = document.getElementById('buzz-frame');
          // Try to measure content height (works if same-origin, silently fails cross-origin)
          try {
            const h = frame.contentDocument?.body?.scrollHeight;
            if (h && h > 100) frame.style.height = (h + 20) + 'px';
          } catch (_) {}

          // Grow iframe until no scrollbar appears
          this.fitFrame();
        },

        fitFrame() {
          const frame = document.getElementById('buzz-frame');
          // Poll height a few times after load to catch lazy-rendered content
          let attempts = 0;
          const timer = setInterval(() => {
            try {
              const h = frame.contentDocument?.body?.scrollHeight;
              if (h && h > 100) frame.style.height = (h + 20) + 'px';
            } catch (_) {}
            if (++attempts >= 8) clearInterval(timer);
          }, 300);
        },

        // Called if iframe fails to load (X-Frame-Options block)
        onFrameError() {
          // Fallback: open buzzheavier directly
          window.location.href = 'https://buzzheavier.com/' + this.fileId;
        }
      };
    }
  </script>
</body>
</html>
